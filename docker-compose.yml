version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: quant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: quant_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quant_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quant_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: 
      context: ./api
    container_name: quant_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./api:/code
      - ./ml:/code/ml_store  # Montage du modèle
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=quant_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quant_network
    # Fix DNS spécifique WSL2 (A garder tant que vous êtes sous Windows)
    dns:
      - 8.8.8.8
      - 8.8.4.4

volumes:
  postgres_data:
    driver: local

networks:
  quant_network:
    driver: bridge