

services:
  postgres:
    image: postgres:15
    container_name: quant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: quant_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quant_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quant_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: 
      context: ./api
    container_name: quant_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./api:/code
      - ./ml:/code/ml_store  # Montage du modèle
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=quant_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quant_network
    # Fix DNS spécifique WSL2 (A garder tant que vous êtes sous Windows)
    dns:
      - 8.8.8.8
      - 8.8.4.4

  airflow-postgres:
    image: postgres:15
    container_name: airflow-postgres1
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init: 
    image: quant-airflow:2.8.1
    build: .
    container_name: airflow-init1
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    volumes:
      - ./init_airflow.sh:/init_airflow.sh
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
    command: bash /init_airflow.sh


  airflow:
    image: quant-airflow:2.8.1
    build: .
    container_name: airflow1
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
    ports:
      - "8080:8080"
    command: >
      bash -c "
      airflow scheduler &
      airflow webserver
      "
volumes:
  postgres_data:
    driver: local
  airflow_db:
    driver: local

networks:
  quant_network:
    driver: bridge