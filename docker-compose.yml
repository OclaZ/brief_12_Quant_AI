version: '3.8'

services:
  # --- 1. Base de Données (Source de Vérité) ---
  postgres:
    image: postgres:15
    container_name: quant_postgres
    environment:
      # STANDARD ÉQUIPE : On utilise "postgres" pour éviter les erreurs "Role does not exist"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: quant_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    command: 
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "max_connections=200"
    networks:
      - quant_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quant_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- 2. API Backend ---
  api:
    build: 
      context: ./api
    container_name: quant_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./api:/code
      - ./ml:/code/ml_store
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=quant_db
      - JAVA_HOME=/usr/lib/jvm/default-java
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quant_network

# --- Volumes Persistants ---
volumes:
  postgres_data:
    driver: local

# --- Réseau Partagé ---
networks:
  quant_network:
    driver: bridge